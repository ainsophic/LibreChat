<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none" role="img" aria-label="Egeo by Ainsophic">
  <defs>
    <linearGradient id="egeo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Wave / E mark -->
  <g transform="translate(8, 10)">
    <!-- Stylised E with wave strokes -->
    <path d="M4 4 L4 56 L38 56" stroke="url(#egeo-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M4 30 L32 30" stroke="url(#egeo-grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M4 4 L38 4" stroke="url(#egeo-grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Wave accent below -->
    <path d="M4 48 Q12 42 20 48 Q28 54 36 48" stroke="url(#egeo-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.65"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="44" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="url(#egeo-grad)">Egeo</text>
  <!-- Sub-label -->
  <text x="63" y="60" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="2.5" fill="#6B7280">AINSOPHIC</text>
</svg>
